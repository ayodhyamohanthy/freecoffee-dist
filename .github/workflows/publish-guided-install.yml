name: Publish guided pilot install
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write reviewed install assets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > 'install-guide.html'
          printf '%s' '' | base64 -d | gzip -d > 'freecoffee-install.sh'
          chmod +x freecoffee-install.sh
      - name: Validate install assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n freecoffee-install.sh
          grep -Fq "not Apple-notarized" install-guide.html
          grep -Fq "252ebc1719fdd54ba7904b0085ce917718639f22c230bca231cf51e0a2908cf8" install-guide.html
          grep -Fq "Open Anyway" install-guide.html
          test "$(grep -o 'class="shot"' install-guide.html | wc -l | tr -d ' ')" = 3
          ! grep -qi "Homebrew" install-guide.html
          grep -Fq 'xattr -dr com.apple.quarantine "$APP"' freecoffee-install.sh
          ! grep -Fq "spctl --master-disable" freecoffee-install.sh
      - name: Commit install assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-guide.html freecoffee-install.sh
          git commit -m "Add honest guided pilot install"
          git push origin HEAD:main
